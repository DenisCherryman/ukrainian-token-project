name: v0.7 adaptation status
on:
  push:
    paths: ['.github/workflows/llm_continuation_status.yml']
  workflow_run:
    workflows: ['v0.7 bilingual LLM embedding continuation']
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the completed workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            RUN_ID=$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
              --jq '{run_id: .id, status: .status, conclusion: .conclusion, url: .html_url, started: .run_started_at, finished: .updated_at}' \
              > results/llm_continuation_ci_status.json
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/llm_continuation.yml/runs?per_page=10" \
              --jq '[.workflow_runs[] | select(.status=="completed")][0] | {run_id: .id, status: .status, conclusion: .conclusion, url: .html_url, started: .run_started_at, finished: .updated_at}' \
              > results/llm_continuation_ci_status.json
          fi
      - name: Commit workflow state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/llm_continuation_ci_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update v0.7 continuation workflow status"
            git pull --rebase -X theirs
            git push
          fi
