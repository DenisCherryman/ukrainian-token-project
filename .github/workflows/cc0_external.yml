name: Independent CC0 Ukrainian holdout (v0.5)
on:
  push:
    paths:
      - '.github/workflows/cc0_external.yml'
      - 'external_cc0.py'
      - 'tests/test_external_cc0.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: independent-cc0-v05
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Check tests
        run: python -m pytest -q
      - name: Fetch pinned non-commercial UD TRAIN/DEV data
        run: |
          python corpora.py --out data/ud_raw --accept-license \
            --uk-ref 21f641ba6109044ce9aafd4b2cbfa20a4ac6e479 \
            --en-ref 4a4d77f599ea53cc405f85d0cec4b2f14f81d42b
          python prepare_ud.py --source data/ud_raw --out data/ud_strict
      - name: Freeze models on UD DEV and evaluate separate CC0 sentences
        run: |
          python external_cc0.py --data data/ud_strict \
            --work runs/cc0_external_v05 \
            --out results/cc0_external_v05.json \
            --limit-uk 3000 --limit-en 2000 \
            > /tmp/utp_cc0.log 2>&1 || { tail -n 140 /tmp/utp_cc0.log; exit 1; }
      - name: Summary
        run: cat results/cc0_external_v05.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit aggregate metrics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/cc0_external_v05.json results/cc0_external_v05.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish independent Tatoeba CC0 aggregate tokenizer evaluation"
            git pull --rebase
            git push
          fi
