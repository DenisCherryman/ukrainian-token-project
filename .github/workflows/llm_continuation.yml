name: v0.7 bilingual LLM embedding continuation
on:
  push:
    paths:
      - '.github/workflows/llm_continuation.yml'
      - 'llm_continuation.py'
      - 'tests/test_llm_continuation.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: utp-llm-continued-v07
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UTP dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all repository tests
        run: python -m pytest -q
      - name: Install CPU-only PyTorch and pinned model tooling
        run: |
          python -m pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.52.4" "huggingface_hub>=0.30,<1" "safetensors>=0.4"
      - name: Download CC0 texts privately, train for 128 predetermined bilingual steps, measure paired likelihood
        run: |
          python llm_continuation.py \
            --samples 30 --vocab 1024 --seed 42 \
            --out results/llm_continuation_v07.json \
            > /tmp/utp_v07.log 2>&1 || { tail -n 100 /tmp/utp_v07.log; exit 1; }
      - name: Print aggregate results in job summary
        run: cat results/llm_continuation_v07.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit metrics and hashes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/llm_continuation_v07.json results/llm_continuation_v07.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish v0.7 bilingual continuation aggregate metrics"
            git pull --rebase -X theirs
            git push
          fi
