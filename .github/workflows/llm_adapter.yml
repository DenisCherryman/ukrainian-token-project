name: v0.6 open-weight LLM tokenizer transplant
on:
  push:
    paths:
      - '.github/workflows/llm_adapter.yml'
      - 'llm_adapter.py'
      - 'tests/test_llm_adapter.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: utp-real-llm-adapter-v06
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing UTP dependencies
        run: python -m pip install -r requirements.txt
      - name: Test all non-model invariants
        run: python -m pytest -q
      - name: Install PyTorch CPU and Transformers
        run: |
          python -m pip install "torch==2.6.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==4.52.4" "huggingface_hub>=0.30,<1" "safetensors>=0.4"
      - name: Run one real Apache-2.0 model; no restricted corpora
        run: |
          python llm_adapter.py \
            --model HuggingFaceTB/SmolLM2-135M \
            --vocab 1024 --sample-uk 10 --sample-en 10 \
            --tuning-steps 4 --out results/llm_adapter_v06.json \
            > /tmp/utp_adapter.log 2>&1 || { tail -n 130 /tmp/utp_adapter.log; exit 1; }
      - name: Post results summary
        run: cat results/llm_adapter_v06.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit aggregate measurements only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/llm_adapter_v06.json results/llm_adapter_v06.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish engineering-only LLM tokenizer transplant measurements"
            git pull --rebase
            git push
          fi
