name: Scale Ukrainian tokenizers across vocabularies and seeds
on:
  push:
    paths:
      - '.github/workflows/ud_multivocab.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: utp-v04-vocab-sweep
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all tests
        run: python -m pytest -q
      - name: Download pinned UD sources for noncommercial research
        run: |
          python corpora.py --out data/ud_raw --accept-license \
            --uk-ref 21f641ba6109044ce9aafd4b2cbfa20a4ac6e479 \
            --en-ref 4a4d77f599ea53cc405f85d0cec4b2f14f81d42b
      - name: Prepare independent document-disjoint partitions
        run: python prepare_ud.py --source data/ud_raw --out data/ud_strict
      - name: Train matched-vocabulary models, freeze DEV selection, and evaluate TEST
        run: |
          python multivocab.py --data data/ud_strict \
            --work runs/multivocab_v04 \
            --out results/multivocab_v04.json \
            --vocabs 1024 4096 8192 16384 32768 \
            --seeds 42 173 2026 \
            --train-budget-bytes 500000 \
            --max-en-regression-pct 10 \
            --bootstrap 600 \
            > /tmp/utp_v04.log 2>&1 || { tail -n 100 /tmp/utp_v04.log; exit 1; }
      - name: Publish human-readable job summary
        run: cat results/multivocab_v04.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit aggregate scores only (never corpora or models)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/multivocab_v04.json results/multivocab_v04.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish measured multi-vocabulary research metrics"
            git push
          fi
