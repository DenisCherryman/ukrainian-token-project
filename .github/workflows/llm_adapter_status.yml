name: v0.6 adapter run status
on:
  push:
    paths: ['.github/workflows/llm_adapter_status.yml']
  workflow_run:
    workflows: ['v0.6 open-weight LLM tokenizer transplant']
    types: [completed]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the just-completed or last complete adapter run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            RUN_ID=$(jq -r '.workflow_run.id' "$GITHUB_EVENT_PATH")
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
              --jq '{run_id: .id, status: .status, conclusion: .conclusion, url: .html_url, started: .run_started_at, finished: .updated_at}' \
              > results/llm_adapter_ci_status.json
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/llm_adapter.yml/runs?per_page=10" \
              --jq '[.workflow_runs[]|select(.status=="completed")][0] | {run_id: .id, status: .status, conclusion: .conclusion, url: .html_url, started: .run_started_at, finished: .updated_at}' \
              > results/llm_adapter_ci_status.json
          fi
      - name: Commit status metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/llm_adapter_ci_status.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish v0.6 open-model integration status"
            git pull --rebase
            git push
          fi
